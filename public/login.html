<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Search — Private Access</title>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-card">
    <div class="auth-mark">S</div>
    <div class="eyebrow">Private library</div>
    <h1>Enter your access code.</h1>
    <p>This course search is private. Use a valid code from the administrator to continue.</p>
    <form id="loginForm">
      <div class="field">
        <label for="code">Access code</label>
        <input class="input" id="code" name="code" autocomplete="one-time-code" spellcheck="false" placeholder="CS-XXXX-XXXX-XXXX" autofocus>
      </div>
      <button class="btn primary block" id="loginBtn" type="submit">Unlock course search</button>
      <div class="error" id="error"></div>
    </form>
    <div class="auth-footer"><span>Codes can expire or be revoked.</span><a href="/admin">Admin panel →</a></div>
  </section>
</main>
<script src="/assets/login.js" defer></script>
</body>
</html>
